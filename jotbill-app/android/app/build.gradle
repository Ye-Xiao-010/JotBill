apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "kotlin-kapt"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def getSentryDsn(buildType) {
    def envFileName = buildType == "release" ? ".env.production" : ".env.development"
    def envFile = file("../../${envFileName}")
    if (!envFile.exists()) { envFile = file("../../.env.development") }
    if (envFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(envFile))
        return props.getProperty("SENTRY_DSN_ANDROID", "")
    }
    return ""
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.jotbill.app"
    defaultConfig {
        applicationId "com.jotbill.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 103
        versionName "0.0.107"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('RELEASE_STORE_FILE') && file(project.property('RELEASE_STORE_FILE')).exists()) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            } else {
                // CI 或本地未配置 release keystore 时，fallback 到 debug
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
            buildConfigField "String", "SENTRY_DSN", "\"${getSentryDsn("debug")}\""
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // 发布包禁止明文网络，AI/更新通道必须使用 HTTPS；debug 仍保留本地开发回环能力。
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            buildConfigField "String", "SENTRY_DSN", "\"${getSentryDsn("release")}\""
            // 真机验证专用开关：允许 adb run-as 读取应用私有数据（数据库导出/诊断）。
            // 仓库默认关闭；本地诊断构建时在 ~/.gradle/gradle.properties 设置
            // enableReleaseDebuggable=true 后重打 release 包，勿在正式发布时开启。
            if (project.findProperty("enableReleaseDebuggable") == "true") {
                debuggable true
            }
        }
    }

    testOptions {
        // JVM 单测中 android.util.Log 等框架方法返回默认值而非抛异常:
        // pending 事件链(hub/notifier)与后续协调器门禁测试依赖日志旁路。
        unitTests {
            returnDefaultValues = true
            // Robolectric matcher 集成测试需要资源与 Manifest 元数据
            includeAndroidResources = true
        }
    }
}

configurations.matching { it.name.contains('AndroidTest') }.all {
    // 阶段七 T2：离线环境缺少 concurrent-futures-ktx 1.2.0，仅在 AndroidTest 配置锁定已缓存兼容版本。
    resolutionStrategy.force 'androidx.concurrent:concurrent-futures-ktx:1.1.0'
}

dependencies {
    // Local-first data layer.
    implementation("androidx.room:room-runtime:2.8.3")

    // 阶段六 T2：官方账单加密压缩包解密（Apache-2.0，Maven Central）。
    implementation("net.lingala.zip4j:zip4j:2.11.5")
    implementation("androidx.room:room-ktx:2.8.3")
    kapt("androidx.room:room-compiler:2.8.3")
    implementation("androidx.sqlite:sqlite-ktx:2.4.0")
    implementation("net.zetetic:android-database-sqlcipher:4.5.4")

    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // LocalBroadcastManager for payment notification service
    implementation("androidx.localbroadcastmanager:localbroadcastmanager:1.1.0")

    // OkHttp for network requests in overlay
    implementation("com.squareup.okhttp3:okhttp:4.12.0")

    // Gson for JSON parsing
    implementation("com.google.code.gson:gson:2.10.1")

    // Sentry for error tracking and logging
    // https://docs.sentry.io/platforms/android/
    implementation("io.sentry:sentry-android:7.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation("junit:junit:4.13.2")
    // 阶段七 T1：本地 JVM 单元测试使用真实 org.json，避免 android.jar 未 mock 实现。
    testImplementation("org.json:json:20180813")
    // 批 0 安全网:matcher 证据链需要 Room 内存库,Robolectric 提供 JVM 上的 Android 环境
    testImplementation("org.robolectric:robolectric:4.14.1")
    testImplementation("androidx.test:core:1.6.1")
    // 批 6:XlsxTableReader 用 XmlPullParser,JVM 单测环境无平台内置实现,补 kxml2
    testImplementation("net.sf.kxml:kxml2:2.3.0")

    // 阶段七 T2：Room 迁移与 androidTest DAO 集成测试。
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test:core:1.7.0") {
        exclude group: "androidx.concurrent", module: "concurrent-futures-ktx"
    }
    androidTestImplementation("androidx.concurrent:concurrent-futures-ktx:1.1.0")
    androidTestImplementation("androidx.test.ext:junit:1.1.5")
    androidTestImplementation("androidx.core:core-ktx:1.13.1")
    androidTestImplementation("androidx.room:room-testing:2.8.3")
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }
}
