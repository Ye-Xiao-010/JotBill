<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>招财猫猫 · 柔光 UI 原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
svg{display:block;flex:none}

/* ============ 设计 token（柔光 Soft）============ */
.root{
  --s-page:#E5E7EE;
  --s-bg:#F4F5F9; --s-surface:#FFFFFF; --s-surface-2:#EEF0F6; --s-sunken:#E7EAF1;
  --s-primary:#4F46E5; --s-primary-soft:#EEF0FF; --s-primary-strong:#4338CA; --s-on-primary:#FFFFFF;
  --s-accent:#F5A524; --s-accent-soft:#FFF4DE; --s-accent-strong:#9A5B00;
  --s-text-1:#12141A; --s-text-2:#454A57; --s-text-3:#646A78; --s-text-4:#A0A5B1;
  --s-divider:#ECEEF3; --s-hairline:#E4E7EE; --s-card-border:transparent;
  --s-income:#15803D; --s-income-soft:#E3F6EA; --s-expense:#DC2626; --s-expense-soft:#FDECEC;
  --s-warn:#B45309; --s-warn-soft:#FFF5E6; --s-warn-icon:#F59E0B;
  --s-info:#4338CA; --s-info-soft:#EEF0FF;
  --s-shadow-sm:0 1px 2px rgba(18,20,26,.04),0 2px 8px -2px rgba(18,20,26,.05);
  --s-shadow-md:0 12px 28px -12px rgba(18,20,26,.18),0 2px 6px rgba(18,20,26,.05);
  --s-shadow-fab:0 10px 22px -6px rgba(79,70,229,.6);
  --s-shadow-hero:0 20px 36px -18px rgba(79,70,229,.7);
  --s-hero:linear-gradient(135deg,#5850EC 0%,#4F46E5 48%,#6052E5 100%);
  --s-hero-2:linear-gradient(135deg,#1F2433 0%,#2B3245 100%);
  --s-tabbar:rgba(255,255,255,.82);
  --s-tile-mix:13%;
  --s-backdrop:rgba(18,20,26,.38);
  --s-phone-shadow:0 40px 70px -30px rgba(30,34,52,.45);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.45;
  color:var(--s-text-1);
  background:var(--s-page);
  padding:32px 24px 72px;
  transition:background-color .3s;
}
.root.dark{
  --s-page:#07080B;
  --s-bg:#0E1014; --s-surface:#171A21; --s-surface-2:#1E222B; --s-sunken:#12151B;
  --s-primary:#8B8DFB; --s-primary-soft:#23264A; --s-primary-strong:#A5A7FF; --s-on-primary:#0E1014;
  --s-accent:#F7B955; --s-accent-soft:#33280F; --s-accent-strong:#F7C873;
  --s-text-1:#F3F4F7; --s-text-2:#C5C9D3; --s-text-3:#8D93A1; --s-text-4:#5C6270;
  --s-divider:#252932; --s-hairline:#2A2F3A; --s-card-border:#232731;
  --s-income:#4ADE80; --s-income-soft:#143222; --s-expense:#F87171; --s-expense-soft:#3A1A1E;
  --s-warn:#FBBF24; --s-warn-soft:#2E2410; --s-warn-icon:#FBBF24;
  --s-info:#A5A7FF; --s-info-soft:#23264A;
  --s-shadow-sm:none;
  --s-shadow-md:0 14px 30px -12px rgba(0,0,0,.7);
  --s-shadow-fab:0 10px 24px -8px rgba(139,141,251,.55);
  --s-shadow-hero:0 20px 40px -20px rgba(79,70,229,.55);
  --s-hero:linear-gradient(135deg,#3B36B8 0%,#4840D6 50%,#5B4FD9 100%);
  --s-hero-2:linear-gradient(135deg,#1B1F2A 0%,#252B3A 100%);
  --s-tabbar:rgba(23,26,33,.82);
  --s-tile-mix:20%;
  --s-backdrop:rgba(0,0,0,.6);
  --s-phone-shadow:0 40px 70px -30px rgba(0,0,0,.9);
}

/* ============ 页面外壳 ============ */
.page-head{max-width:1280px;margin:0 auto 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;color:var(--s-primary);letter-spacing:.04em;margin-bottom:6px}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.page-head p{color:var(--s-text-3);margin-top:6px;max-width:640px}
.gallery{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;gap:40px 32px;justify-content:center}
.shot{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.shot-cap{display:flex;gap:10px;align-items:baseline;padding-left:6px}
.shot-cap b{font-size:13px;color:var(--s-primary);font-variant-numeric:tabular-nums}
.shot-cap span{font-weight:600}
.shot-cap small{color:var(--s-text-3);font-size:12px}

/* ============ 手机框 ============ */
.phone{width:376px;height:800px;border-radius:50px;padding:8px;background:#0A0B0F;box-shadow:var(--s-phone-shadow),inset 0 0 0 1.5px #2A2C33;flex:none}
.screen{position:relative;width:360px;height:784px;border-radius:42px;overflow:hidden;background:var(--s-bg);display:flex;flex-direction:column;transition:background-color .3s}
.statusbar{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 30px;font-size:13px;font-weight:600;color:var(--s-text-1);position:relative;z-index:5}
.statusbar::after{content:"";position:absolute;left:50%;top:10px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#0A0B0F}
.sb-ic{display:flex;gap:6px;align-items:center}
.sb-ic svg{fill:currentColor}
.batt{width:24px;height:12px;border-radius:4px;border:1.5px solid currentColor;padding:1.5px;opacity:.9;position:relative}
.batt i{display:block;height:100%;width:72%;background:currentColor;border-radius:1.5px}
.view{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:116px}
.scroll::-webkit-scrollbar{display:none}
.toast-layer{position:absolute;left:0;right:0;bottom:104px;display:flex;justify-content:center;pointer-events:none;z-index:60}
.toast{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#1C1F27;color:#fff;font-size:13px;font-weight:500;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2)}
.root.dark .toast{background:#F3F4F7;color:#12141A}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

/* ============ 通用元素 ============ */
.spacer{flex:1}
.tnum{font-variant-numeric:tabular-nums}
.card{background:var(--s-surface);border-radius:20px;box-shadow:var(--s-shadow-sm);border:1px solid var(--s-card-border)}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--s-text-2);position:relative;transition:background-color .2s,transform .12s}
.icon-btn:active{background:var(--s-surface-2);transform:scale(.94)}
.icon-btn.sm{width:34px;height:34px;border-radius:12px}
.icon-btn.filled{background:var(--s-surface);box-shadow:var(--s-shadow-sm);border:1px solid var(--s-card-border)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--s-expense);box-shadow:0 0 0 2px var(--s-bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 10px 20px}
.topbar h2,.t-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
.topbar-actions{display:flex;gap:4px}
.month-btn{display:flex;align-items:center;gap:4px;color:var(--s-text-1)}
.month-btn svg{color:var(--s-text-3);margin-top:2px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 10px}
.section-head h3{font-size:17px;font-weight:600}
.link{display:flex;align-items:center;gap:2px;color:var(--s-text-3);font-size:13px;font-weight:500}
.btn{height:38px;padding:0 16px;border-radius:14px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background-color .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--s-primary);color:var(--s-on-primary)}
.btn.primary:active{background:var(--s-primary-strong)}
.btn.soft{background:var(--s-primary-soft);color:var(--s-primary-strong)}
.root.dark .btn.soft{color:var(--s-primary-strong)}
.btn.ghost{color:var(--s-text-3);padding:0 10px}
.btn.danger{background:var(--s-expense);color:#fff}
.btn.block{width:100%;height:48px;border-radius:16px;font-size:15px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--s-surface-2);color:var(--s-text-2);font-size:13px;font-weight:500;white-space:nowrap}
.chip svg{color:var(--s-text-3)}
.cat-tile{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) var(--s-tile-mix),var(--s-surface));color:var(--c);flex:none}
.root.dark .cat-tile{color:color-mix(in srgb,var(--c) 70%,#fff)}
.cat-tile.lg{width:48px;height:48px;border-radius:16px}
.cat-tile.sm{width:32px;height:32px;border-radius:11px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--s-sunken);position:relative;transition:background-color .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.3,.7,.4,1.2)}
.switch.on{background:var(--s-primary)}
.switch.on::after{transform:translateX(18px)}
.root.dark .switch:not(.on){background:#2C313C}

/* 分段控件（滑动指示器） */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:3px;border-radius:14px;background:var(--s-surface-2)}
.seg-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));border-radius:11px;background:var(--s-surface);box-shadow:0 1px 3px rgba(18,20,26,.08),0 1px 1px rgba(18,20,26,.04);transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.root.dark .seg-ind{background:#2C313C}
.seg-btn{position:relative;z-index:1;height:32px;text-align:center;font-size:13px;font-weight:500;color:var(--s-text-3);transition:color .2s}
.seg-btn.on{color:var(--s-text-1);font-weight:600}
.seg.sm .seg-btn{height:28px;font-size:12px;padding:0 10px}
.seg.sm{border-radius:12px}.seg.sm .seg-ind{border-radius:9px}

/* ============ 底部导航（悬浮胶囊） ============ */
.tabbar{position:absolute;left:12px;right:12px;bottom:14px;height:68px;border-radius:26px;background:var(--s-tabbar);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:var(--s-shadow-md);border:1px solid var(--s-card-border);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--s-text-3);font-size:11px;font-weight:500}
.tab-ic{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background-color .25s,color .2s}
.tab.on{color:var(--s-primary)}
.tab.on .tab-ic{background:var(--s-primary-soft)}
.tab.on .tab-label{font-weight:600}
.fab-wrap{display:grid;place-items:center}
.fab{width:54px;height:54px;border-radius:50%;background:var(--s-hero);color:#fff;display:grid;place-items:center;box-shadow:var(--s-shadow-fab);margin-top:-30px;border:4px solid var(--s-bg);transition:transform .15s}
.fab:active{transform:scale(.92)}

/* ============ 首页 ============ */
.hero{margin:2px 16px 0;padding:18px 20px 16px;border-radius:28px;background:var(--s-hero);color:#fff;position:relative;overflow:hidden;box-shadow:var(--s-shadow-hero)}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-110px;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)}
.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;left:-60px;bottom:-90px;background:radial-gradient(circle,rgba(255,196,92,.28),rgba(255,196,92,0) 70%)}
.hero > *{position:relative;z-index:1}
.hero-head{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.82);font-weight:500}
.hero-eye{color:rgba(255,255,255,.75);padding:2px}
.hero-link{display:flex;align-items:center;gap:2px;color:rgba(255,255,255,.88);font-size:12px;font-weight:500;padding:4px 8px 4px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.hero-amount{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:6px 0 14px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-amount .cur{font-size:22px;font-weight:600;margin-right:2px}
.hero-amount .dec{font-size:22px;font-weight:600;opacity:.8}
.hero-stats{display:flex;align-items:center;gap:16px}
.hero-stats div:not(.sep){display:flex;flex-direction:column;gap:2px}
.hero-stats span{font-size:12px;color:rgba(255,255,255,.72)}
.hero-stats b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hero-stats .sep{width:1px;height:28px;background:rgba(255,255,255,.22)}
.budget{margin-top:16px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.12)}
.budget-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:rgba(255,255,255,.85);white-space:nowrap}
.budget-row b{font-weight:600;color:#fff}
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.2);margin:8px 0 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFE29A,#FFC35C)}
.callout{margin:14px 16px 0;width:calc(100% - 32px);display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;border-radius:20px;background:var(--s-warn-soft);color:var(--s-text-1);transition:transform .12s}
.callout:active{transform:scale(.98)}
.callout-icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--s-surface);color:var(--s-warn-icon);flex:none;position:relative}
.callout-icon em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--s-expense);color:#fff;font-size:11px;font-style:normal;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--s-warn-soft)}
.callout-body{flex:1;display:flex;flex-direction:column;gap:1px}
.callout-body b{font-size:14px;font-weight:600}
.callout-body small{font-size:12px;color:var(--s-text-3)}
.callout > svg{color:var(--s-text-4)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 16px 0}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--s-text-2);font-weight:500;transition:transform .12s}
.quick button:active{transform:scale(.94)}
.quick .q-ic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--s-surface);box-shadow:var(--s-shadow-sm);border:1px solid var(--s-card-border);color:var(--c)}
.root.dark .quick .q-ic{color:color-mix(in srgb,var(--c) 70%,#fff)}
.day{padding:0 16px;margin-bottom:14px}
.day-head{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
.day-badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--s-surface-2);color:var(--s-text-2)}
.day-badge.today{background:var(--s-primary-soft);color:var(--s-primary-strong)}
.day-date{font-size:13px;color:var(--s-text-3)}
.day-sum{font-size:12px;color:var(--s-text-3);font-variant-numeric:tabular-nums}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;transition:background-color .15s;position:relative}
.row:active{background:var(--s-surface-2)}
.row + .row::before{content:"";position:absolute;top:0;left:66px;right:14px;height:1px;background:var(--s-divider)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font-size:12px;color:var(--s-text-3);display:flex;align-items:center;gap:6px}
.auto{display:inline-flex;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--s-primary);background:var(--s-primary-soft);padding:1px 6px 1px 4px;border-radius:6px}
.row-amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-amt.expense{color:var(--s-expense)}
.row-amt.income{color:var(--s-income)}
.row-amt.neutral{color:var(--s-text-1)}
.more-btn{display:flex;margin:4px auto 0;align-items:center;gap:4px;color:var(--s-text-3);font-size:13px;padding:8px 14px;border-radius:999px}
.more-btn:active{background:var(--s-surface-2)}

/* ============ 记账弹层 ============ */
.backdrop{position:absolute;inset:0;background:var(--s-backdrop);z-index:40}
.backdrop.enter{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:93%;background:var(--s-surface);border-radius:30px 30px 0 0;z-index:41;display:flex;flex-direction:column;padding:8px 16px 18px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.25)}
.root.dark .sheet{background:#151820}
.sheet.enter{animation:sheetIn .38s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetIn{from{transform:translateY(100%)}}
.grabber{width:40px;height:5px;border-radius:999px;background:var(--s-hairline);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head .seg{flex:1}
.amount-block{padding:22px 4px 12px;text-align:right}
.amount-expr{font-size:13px;color:var(--s-text-3);height:18px;font-variant-numeric:tabular-nums}
.amount{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--s-text-1);transition:color .2s}
.amount .cur{font-size:24px;font-weight:600;margin-right:4px;color:var(--s-text-3)}
.amount.expense{color:var(--s-expense)}
.amount.income{color:var(--s-income)}
.amount.empty{color:var(--s-text-4)}
.caret{display:inline-block;width:2px;height:36px;background:var(--s-primary);margin-left:3px;vertical-align:-4px;animation:blink 1s steps(1) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
.field-row{display:flex;gap:8px;padding:0 0 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--s-divider)}
.field-row::-webkit-scrollbar{display:none}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 4px;padding:16px 0 12px;flex:1;align-content:start}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--s-text-2);transition:transform .12s}
.cat:active{transform:scale(.92)}
.cat .cat-tile{transition:box-shadow .2s,background-color .2s}
.cat.on .cat-tile{background:var(--c);color:#fff;box-shadow:0 8px 16px -8px var(--c)}
.root.dark .cat.on .cat-tile{color:#fff}
.cat.on{color:var(--s-text-1);font-weight:600}
.xfer{flex:1;padding:16px 0 12px;display:flex;flex-direction:column;gap:10px;position:relative}
.xfer-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--s-surface-2)}
.xfer-row small{display:block;font-size:12px;color:var(--s-text-3)}
.xfer-row b{font-size:15px;font-weight:600}
.xfer-swap{position:absolute;right:22px;top:66px;width:34px;height:34px;border-radius:50%;background:var(--s-surface);box-shadow:var(--s-shadow-md);display:grid;place-items:center;color:var(--s-primary);z-index:2}
.xfer-tip{font-size:12px;color:var(--s-text-3);padding:2px 4px}
.acc-tile{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:700;font-size:15px;flex:none}
.acc-tile.sm{width:34px;height:34px;border-radius:12px;font-size:13px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:50px;border-radius:16px;background:var(--s-surface-2);font-size:20px;font-weight:500;display:grid;place-items:center;color:var(--s-text-1);font-variant-numeric:tabular-nums;transition:transform .08s,background-color .15s}
.key:active{transform:scale(.95);background:var(--s-sunken)}
.root.dark .key{background:#1F232C}

function bigMoney(n) {
  const [i, d] = num(n).split('.');
  return `<span class="cur">¥</span>${i}<span class="dec">.${d}</span>`;

function evalExpr(expr) {
  if (!expr) return 0;
  const parts = expr.match(/[+-]?[^+-]+/g) || [];
  return Math.round(parts.reduce((s, x) => s + (parseFloat(x) || 0), 0) * 100) / 100;
}

}

/* ================= 渲染 ================= */
function screenHTML(p) {
  let html;
  if (p.overlay === 'review') html = reviewScreen(p);
  else if (p.tab === 'reports') html = reportsScreen(p);
  else if (p.tab === 'ai') html = aiScreen(p);
  else if (p.tab === 'me') html = meScreen(p);
  else html = homeScreen(p);
  if (p.sheet) html += sheet(p);
  return html;
}
function render(p) {
  const view = phoneEls[p.id].querySelector('.view');
  const keep = [...view.querySelectorAll('[data-scroll]')].map(s => [s.dataset.scroll, s.scrollTop]);
  view.innerHTML = screenHTML(p);
  keep.forEach(([k, v]) => { const s = view.querySelector(`[data-scroll="${k}"]`); if (s) s.scrollTop = v; });
  if (p.scrollChatBottom) { const s = view.querySelector('[data-scroll="ai"]'); if (s) s.scrollTop = s.scrollHeight; p.scrollChatBottom = false; }
  view.querySelectorAll('[data-slide-to]').forEach(ind => { void ind.offsetWidth; ind.style.transform = `translateX(${ind.dataset.slideTo * 100}%)`; });
  p.sheetEnter = false;
}
function toast(p, msg) {
  const layer = phoneEls[p.id].querySelector('.toast-layer');
  layer.innerHTML = `<div class="toast">${icon('check', 14, 2.6)}<span>${msg}</span></div>`;
  const id = ++p.toastId;
  setTimeout(() => { if (p.toastId === id) layer.innerHTML = ''; }, 1900);
}
function leaveCard(p, el, after) {
  const card = el.closest('.rv-card');
  if (card) card.classList.add('leaving');
  setTimeout(() => { after(); render(p); }, 240);
}

/* ================= 交互 ================= */
const ACTIONS = {
  noop: (p, a) => toast(p, `${a || '该入口'}（原型未展开）`),
  tab: (p, a) => { p.tab = a; p.overlay = null; },
  openReview: (p) => { p.overlay = 'review'; p.review.selecting = false; p.review.selected.clear(); },
  back: (p) => { p.overlay = null; },
  openSheet: (p) => { p.sheet = true; p.sheetEnter = true; p.bill = {type:'expense', expr:'', cat:'food'}; delete p.segPrev.billType; },
  closeSheet: (p) => { p.sheet = false; },
  billType: (p, a) => { p.bill.type = a; if (a === 'income' && !INC_CATS.includes(p.bill.cat)) p.bill.cat = 'salary'; if (a === 'expense' && !EXP_CATS.includes(p.bill.cat)) p.bill.cat = 'food'; },
  cat: (p, a) => { p.bill.cat = a; },
  key: (p, k) => {
    const b = p.bill; let e = b.expr;
    if (k === 'del') { b.expr = e.slice(0, -1); return; }
    if (k === '+' || k === '-') { if (!e) return; if (/[+-]$/.test(e)) e = e.slice(0, -1); b.expr = e + k; return; }
    const cur = e.split(/[+-]/).pop();
    if (k === '.') { if (cur.includes('.')) return; b.expr = e + (cur === '' ? '0.' : '.'); return; }
    if (cur.includes('.') && cur.split('.')[1].length >= 2) return;
    if (cur === '0') { b.expr = e.slice(0, -1) + k; return; }
    if (cur.replace('.', '').length >= 8) return;
    b.expr = e + k;
  },
  save: (p, a) => {
    const v = evalExpr(p.bill.expr), t = p.bill.type;
    if (v <= 0) { toast(p, '请输入金额'); return false; }
    if (t === 'expense' || t === 'income') {
      p.txns.unshift({id:'n' + Date.now(), day:23, time:'15:36', title:CATS[p.bill.cat].n, cat:p.bill.cat, amt:v, type:t, src:'手动', auto:false});
      p.added[t] += v;
    }
    const label = {expense:'支出', income:'收入', transfer:'转账', repayment:'还款'}[t];
    p.bill.expr = '';
    if (a !== 'again') { p.sheet = false; if (!p.overlay) p.tab = 'home'; }
    render(p); toast(p, `已记一笔${label} ¥${num(v)}`); return false;
  },
  toggleHide: (p) => { p.hide = !p.hide; },
  toggleBudget: (p) => { p.showBudget = !p.showBudget; },
  reportSeg: (p, a) => { p.reportSeg = a; },
  period: (p, a) => { p.period = a; },
  trendView: (p, a) => { p.trendView = a; },
  day: (p, a) => { p.selDay = +a; },
  month: (p, a) => { p.selMonth = +a; },
  toggleSelect: (p) => { p.review.selecting = !p.review.selecting; p.review.selected.clear(); },
  pick: (p, a) => { const s = p.review.selected; s.has(a) ? s.delete(a) : s.add(a); },
  selectAll: (p) => { const r = p.review; const all = r.items.every(i => r.selected.has(i.id)); r.selected = all ? new Set() : new Set(r.items.map(i => i.id)); },
  ignoreSelected: (p) => {
    const r = p.review, n = r.selected.size;
    r.items = r.items.filter(i => !r.selected.has(i.id)); r.selected.clear(); r.selecting = false;
    render(p); toast(p, `已忽略 ${n} 笔，不会入账`); return false;
  },
  confirm: (p, a, el) => {
    const it = p.review.items.find(i => i.id === a);
    if (!it.account) { toast(p, '缺少付款账户，请先点「编辑」选择'); return false; }
    leaveCard(p, el, () => {
      p.review.items = p.review.items.filter(i => i.id !== a);
      p.txns.unshift({id:'c' + a + Date.now(), day:23, time:it.time.split(' ')[1], title:it.title, cat:it.cat, amt:it.amt, type:'expense', src:it.src.split(' · ')[0], auto:true});
      p.added.expense += it.amt;
      setTimeout(() => toast(p, `已确认入账 ¥${num(it.amt)}`), 0);
    });
    return false;
  },
  ignore: (p, a, el) => {
    leaveCard(p, el, () => { p.review.items = p.review.items.filter(i => i.id !== a); setTimeout(() => toast(p, '已忽略，不会入账'), 0); });
    return false;
  },
  edit: (p, a) => {
    const it = p.review.items.find(i => i.id === a);
    if (!it.account) { it.account = '微信零钱'; it.reason = {kind:'info', icon:'check', title:'已补全', text:'已选择付款账户「微信零钱」，可以确认入账了'}; render(p); toast(p, '已选择账户：微信零钱（模拟编辑）'); return false; }
    toast(p, '编辑面板（原型未展开）'); return false;
  },
  resetReview: (p) => { p.review.items = REVIEW.map(r => ({...r})); p.review.selecting = false; p.review.selected.clear(); },
  theme: (p, a) => { p.themePick = a; if (a !== 'soft') toast(p, '原型只演示「柔光」，旧主题保持现状'); },
  toggleDark: () => { setDark(!document.getElementById('root').classList.contains('dark')); return false; },
  ask: (p, a) => {
    const q = AI_Q[a];
    p.chat.push({role:'user', text:q.q}, {role:'ai', typing:true});
    p.scrollChatBottom = true;
    setTimeout(() => {
      p.chat.pop();
      const pd = q.pending ? {title:'午饭', cat:'food', amt:28} : false;
      p.chat.push({role:'ai', text:q.a, pending:pd});
      if (pd) p.review.items.unshift({id:'ai' + Date.now(), src:'AI 对话', srcIcon:'sparkles', time:'今天 15:36', title:pd.title, cat:pd.cat, amt:pd.amt,
        reason:{kind:'info', icon:'sparkles', title:'AI 生成', text:'由 AI 对话生成，核对金额与分类后确认入账'}, account:'招商银行 ·2381'});
      p.scrollChatBottom = true; render(p);
    }, 750);
  },
  sendInput: (p) => {
    const inp = phoneEls[p.id].querySelector('[data-ai-input]');
    const raw = (inp ? inp.value : '').trim();
    if (!raw) { ACTIONS.ask(p, 'q1'); return; }
    p.chat.push({role:'user', text:esc(raw)}, {role:'ai', typing:true});
    p.scrollChatBottom = true;
    const m = raw.match(/(\d+(?:\.\d{1,2})?)/);
    setTimeout(() => {
      p.chat.pop();
      if (m) {
        const amt = parseFloat(m[1]);
        const title = esc(raw.replace(m[0], '').replace(/[元块¥￥,，。]/g, '').trim() || '快捷消费');
        const cat = /咖啡|奶茶|茶/.test(title) ? 'coffee' : /打车|滴滴|地铁|公交/.test(title) ? 'traffic' : /买|购|衣服|鞋/.test(title) ? 'shop' : 'food';
        const pd = {title, cat, amt};
        p.chat.push({role:'ai', text:`已为你生成 1 笔待确认账单（¥${num(amt)}），确认后才会入账。`, pending:pd});
        p.review.items.unshift({id:'ai' + Date.now(), src:'AI 对话', srcIcon:'sparkles', time:'今天 15:36', title, cat, amt,
          reason:{kind:'info', icon:'sparkles', title:'AI 生成', text:'由 AI 对话生成，核对金额与分类后确认入账'}, account:'招商银行 ·2381'});
      } else {
        p.chat.push({role:'ai', text:`11 月当前共支出 <b>${money(BASE.expense + p.added.expense)}</b>，你可以直接输入「奶茶 18」让我生成待确认账单。`});
      }
      p.scrollChatBottom = true; render(p);
    }, 650);
  },
};

function setDark(on) {
  document.getElementById('root').classList.toggle('dark', on);
  renderPageCtrl();
  phones.forEach(render);
}
function renderPageCtrl() {
  const dark = document.getElementById('root').classList.contains('dark');
  const ctl = {segPrev: renderPageCtrl.prev || {}};
  document.getElementById('pageCtrl').innerHTML = `<div style="width:200px">${seg(ctl, 'mode', [{k:'light',l:'浅色'},{k:'dark',l:'深色'}], dark ? 'dark' : 'light', 'pageMode')}</div>`;
  renderPageCtrl.prev = ctl.segPrev;
  document.querySelectorAll('#pageCtrl [data-slide-to]').forEach(ind => { void ind.offsetWidth; ind.style.transform = `translateX(${ind.dataset.slideTo * 100}%)`; });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, arg = t.dataset.arg;
  if (act === 'pageMode') { setDark(arg === 'dark'); return; }
  const ph = t.closest('[data-phone]');
  if (!ph) return;
  const p = phones[+ph.dataset.phone];
  const fn = ACTIONS[act];
  if (!fn) return;
  e.stopPropagation();
  if (fn(p, arg, t) !== false) render(p);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('[data-ai-input]')) return;
  const ph = e.target.closest('[data-phone]');
  if (!ph) return;
  const p = phones[+ph.dataset.phone];
  ACTIONS.sendInput(p);
  render(p);
});
